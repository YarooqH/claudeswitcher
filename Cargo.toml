[package]
name = "claude-sync-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "GPUI desktop dashboard & system-tray profile switcher for Claude Desktop on Windows"
license = "MIT"
publish = false

[[bin]]
name = "claude-sync-tray"
path = "src/main.rs"

[dependencies]
# GPU-accelerated desktop UI framework (DirectX / DirectWrite on Windows).
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
# Native tray icon + menu.
tray-icon = "0.26"
# HKCU Run-key autostart.
winreg = "0.56"
# Directory junctions (NTFS reparse points) — no admin rights required.
junction = "2.1"
# Config persistence.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
# Embeds the executable icon.
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
